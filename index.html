<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Planning Eliot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app à onglets (Jour / Semaine / Partiels), grille horaire 00h–24h à 5 couloirs, barre d'onglets en bas */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#101826; --muted:#5B6576; --line:#D9DEE6; --soft:#E4E8EE;
  --accent:#2F5BFF; --on-accent:#FFFFFF;
  --c-sport:#1E9E6A; --c-entr:#0E8FA6; --c-grun:#8DAA00; --c-cours:#4F5BD5; --c-spuc:#E08A00; --c-rev:#B03FC8; --c-event:#E0456B;
  --t-sport:#DDF4EA; --t-entr:#D8F0F5; --t-cours:#E3E6FB; --t-spuc:#FCEFD8; --t-rev:#F4E1F8; --t-event:#FCE1E8;
  --now:#E0456B;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hour:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1118; --panel:#141B25; --ink:#E8EDF5; --muted:#8E99AB; --line:#243042; --soft:#1B2431;
  --accent:#6E8BFF; --on-accent:#0C1118;
  --c-sport:#3CCB8F; --c-entr:#3FC6DD; --c-grun:#C8E64A; --c-cours:#8B94FF; --c-spuc:#FFB23E; --c-rev:#D77BEB; --c-event:#FF6F92;
  --t-sport:#123326; --t-entr:#0F2E36; --t-cours:#1E2350; --t-spuc:#3A2A10; --t-rev:#36173E; --t-event:#3E1622;
  --now:#FF6F92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118; --panel:#141B25; --ink:#E8EDF5; --muted:#8E99AB; --line:#243042; --soft:#1B2431;
  --accent:#6E8BFF; --on-accent:#0C1118;
  --c-sport:#3CCB8F; --c-entr:#3FC6DD; --c-grun:#C8E64A; --c-cours:#8B94FF; --c-spuc:#FFB23E; --c-rev:#D77BEB; --c-event:#FF6F92;
  --t-sport:#123326; --t-entr:#0F2E36; --t-cours:#1E2350; --t-spuc:#3A2A10; --t-rev:#36173E; --t-event:#3E1622;
  --now:#FF6F92; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,36px);font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--c-event);border-color:var(--c-event)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px;line-height:1}
.status{font-size:12.5px;color:var(--muted)}

/* Header jour */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.wd{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 0 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wd b{font-family:var(--f-display);font-size:18px}
.wd .dots{display:flex;gap:3px;height:6px}
.wd .dots i{width:6px;height:6px;border-radius:50%}
.wd.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wd.sel small{color:var(--bg);opacity:.75}
.wd.today:not(.sel){border-color:var(--accent)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.chip i{width:8px;height:8px;border-radius:50%}

/* Grille */
.gridbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:52px repeat(5,minmax(124px,1fr));min-width:672px;position:relative}
.colhead{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.colhead i{width:9px;height:9px;border-radius:3px;flex:none}
.timecol{position:relative;border-right:1px solid var(--line)}
.tlabel{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding:2px 6px 0 0}
.lane{position:relative;border-right:1px solid var(--soft);height:calc(var(--hour)*24);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--soft) calc(var(--hour) - 1px),var(--soft) var(--hour))}
.lane:last-child{border-right:0}
.block{position:absolute;left:4px;width:calc(100% - 8px);border-radius:10px;padding:5px 8px;font-size:12.5px;overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;gap:1px;border-left:4px solid}
.block b{font-weight:600;line-height:1.2}
.block span{font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.block.done{opacity:.55}
.block.split{padding:5px 6px;box-shadow:0 0 0 1.5px var(--panel)}
.block.split b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.block.done b{text-decoration:line-through}
.nowline{position:absolute;left:52px;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.empty{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--soft)}

/* Semaine */
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.wcol.today{border-color:var(--accent)}
.wbar{position:relative;height:300px;background:var(--soft);border-radius:8px;overflow:hidden}
.wbar i{position:absolute;left:3px;right:3px;border-radius:3px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tot .meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.tot .meter i{display:block;height:100%}
.tot b{font-family:var(--f-display);font-size:24px}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tplday{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding-block:6px;border-top:1px solid var(--soft)}
.tplday:first-of-type{border-top:0}
.tplday ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;min-width:0}

/* Partiels */
.countdown{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.countdown .big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,12vw,72px);line-height:.9}
.countdown .eyebrow{color:var(--bg);opacity:.7}
.countdown input{background:transparent;border:1px solid currentColor;border-radius:8px;padding:4px 8px;color:var(--bg);color-scheme:inherit}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ephead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--soft)}
.pill.warn{background:var(--t-event);color:var(--c-event)}
.pill.ok{background:var(--t-sport);color:var(--c-sport)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c-rev)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.items li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft)}
.items li label{flex:1;min-width:0;overflow-wrap:anywhere}
.items li.done label{text-decoration:line-through;color:var(--muted)}
.items input[type=checkbox]{width:20px;height:20px;accent-color:var(--c-rev)}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:30px;height:30px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%}

/* Tâches */
.todocard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.todoform{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items li .pill{flex:none}
.items input[data-todo]{accent-color:var(--accent)}
#view>.ep{margin-bottom:10px}

/* Entraînements */
.tabs .short{display:none}
@media (max-width:520px){.tabs .long{display:none}.tabs .short{display:inline}.tabs a{font-size:12px;padding:8px 2px}.tabs{gap:3px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:26px;line-height:1.1}
.loadchart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.loadchart svg{width:100%;height:auto;display:block}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-family:var(--f-mono);font-size:13px}
.rpe button.on{background:var(--c-sport);border-color:var(--c-sport);color:var(--panel)}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--soft)}
.sess:first-of-type{border-top:0}
.sess .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:44px;line-height:1.3}
.sess .d b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink)}
.sess p{margin:2px 0 0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--t-sport);color:var(--c-sport)}
.person{display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grid4{grid-template-columns:1fr 1fr}}
#trainform .two{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.progday{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--soft)}
.progday:first-of-type{border-top:0}
.progday.past{opacity:.6}
.progday .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.progday .d b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink)}
.progitems{display:flex;flex-direction:column;gap:6px;min-width:0}
.progitem{display:flex;gap:8px;align-items:center}
.pi{flex:1;min-width:0;text-align:left;border:0;border-left:4px solid;background:var(--soft);border-radius:8px;padding:7px 10px;font-size:13.5px;overflow-wrap:anywhere}
.qbanner{background:var(--t-sport);color:var(--c-sport);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.sechead{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--c-sport);margin-top:4px;overflow-wrap:anywhere}
.exo{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.exhead{display:flex;gap:6px;align-items:center}
.exname{flex:1;min-width:0;font-weight:600;background:var(--panel)}
.exmeta{display:grid;grid-template-columns:1.3fr 1fr;gap:6px}
.exmeta .field,.setrow .field,.exfoot .field{background:var(--panel);padding:7px 9px;font-size:13.5px}
.setrow{display:grid;grid-template-columns:26px 1fr 8px 1fr 8px 30px;gap:5px;align-items:center}
.exfoot{display:flex;gap:6px;align-items:center}
.exfoot .field{flex:1;min-width:0}
.picker{border:1px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.letters button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-family:var(--f-display);font-weight:800}
.letters button.on{background:var(--c-sport);border-color:var(--c-sport);color:var(--panel)}
.exchips{display:flex;flex-wrap:wrap;gap:6px}
.exchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;text-align:left}
.planned{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft);flex-wrap:wrap}
.planned:first-of-type{border-top:0}

.tdtext{flex:1;min-width:0;text-align:left;border:0;background:none;padding:2px 0;font-size:15px;overflow-wrap:anywhere;color:var(--ink)}
.items li.done .tdtext{text-decoration:line-through;color:var(--muted)}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:20px;width:30px;height:34px;display:grid;place-items:center;border-radius:8px;flex:none}
.grip:active{background:var(--soft)}
.exo{transition:transform .15s ease}
.exo.dragging{transition:none;z-index:5;position:relative;box-shadow:0 10px 28px rgba(16,24,38,.22);border-color:var(--c-sport)}
.dsbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}

.calwrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdh{font-size:11px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cday{min-height:72px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;overflow:hidden;color:var(--ink)}
.cday.past{opacity:.45}
.cday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cday.exam{border:2px solid var(--ec);background:color-mix(in srgb,var(--ec) 13%,var(--panel))}
.cnum{font-family:var(--f-mono);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmon{color:var(--muted);font-weight:500}
.cend{font-family:var(--f-body);font-size:9.5px;font-weight:700;color:var(--c-event);text-transform:uppercase}
.cex{font-size:10.5px;font-weight:700;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cdots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.cdots i{width:8px;height:8px;border-radius:2px}
.chrs{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.clegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.clegend span{display:inline-flex;align-items:center;gap:5px}
.clegend i,.epdot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
@media (min-width:700px){.cday{min-height:92px;padding:7px}.cex{font-size:12px}}
@media (max-width:420px){.cday{min-height:60px;padding:3px}.cex{font-size:9.5px}.cal{gap:3px}}
.epchips{display:flex;flex-wrap:wrap;gap:6px}
.epchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.epchip i{width:9px;height:9px;border-radius:3px;background:var(--ec)}
.epchip .mono{font-size:11px;color:var(--muted);font-weight:500}
.epchip.on{border-color:var(--ec);background:color-mix(in srgb,var(--ec) 18%,var(--panel))}
.epchip.on::after{content:"✓";color:var(--ec);font-weight:800}
.dswarn{background:var(--t-event);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
.tabs a{flex:1;max-width:160px;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 6px;border-radius:12px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;box-shadow:0 8px 24px rgba(20,30,60,.25)}

/* Feuille d'édition */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button i{width:8px;height:8px;border-radius:50%}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:40}
@media (max-width:520px){.wbar{height:220px}.wcol small{font-size:10px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Ajouter un créneau">+</button>
<nav class="tabs" aria-label="Sections">
  <a href="#jour" data-tab="jour">Jour</a>
  <a href="#taches" data-tab="taches">Tâches</a>
  <a href="#entrainements" data-tab="entrainements" aria-label="Entraînements"><span class="long">Entraînements</span><span class="short">Entraîn.</span></a>
  <a href="#semaine" data-tab="semaine">Semaine</a>
  <a href="#partiels" data-tab="partiels">Partiels</a>
</nav>
<div id="sheetroot"></div>

<script>
const COLS=[
  {k:"sport",n:"Sport perso"},
  {k:"cours",n:"Cours STAPS"},
  {k:"spuc",n:"SPUC / Comité"},
  {k:"rev",n:"Révisions / travail"},
  {k:"event",n:"Événements"}
];
const CV=k=>`var(--c-${k})`, TV=k=>`var(--t-${k})`;
const JOURS=["dim","lun","mar","mer","jeu","ven","sam"];
const JOURS_L=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const toMin=t=>{const[h,m]=(t||"0:0").split(":").map(Number);return h*60+(m||0)};
const dur=b=>Math.max(0,(b.end==="00:00"?1440:toMin(b.end))-toMin(b.start));
const fmtH=m=>{const h=Math.floor(m/60),r=m%60;return r?`${h}h${pad(r)}`:`${h}h`};
const uid=()=>Math.random().toString(36).slice(2,10);

const state={train:[],todos:[],days:{},template:{days:{}},rev:{endDate:"2026-12-15",epreuves:[]},sel:key(new Date()),online:false};
let db=null;

/* ---------- Stockage : base partagée de l'appli, sinon ce navigateur ---------- */
function lsGet(k,f){try{const v=localStorage.getItem("pl_"+k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem("pl_"+k,JSON.stringify(v))}catch(e){}}
const queue={};
function save(path,data){
  if(!importing){const t=Date.now();state.lastEdit=t;lsSet("meta",{lastEdit:t})}
  if(db){
    const run=async()=>{try{await db.doc(path).set(data)}catch(e){toast("Enregistrement impossible, réessaie.")}};
    queue[path]=(queue[path]||Promise.resolve()).then(run);
  }else{lsSet(path,data)}
}
function saveDay(k){save("days/"+k,{blocks:state.days[k]||[]})}
function saveTemplate(){save("settings/template",state.template)}
function saveRev(){save("revision/state",state.rev)}
function saveTrain(){save("training/log",{sessions:state.train});if(!db)lsSet("training/log",{sessions:state.train})}
function saveTodos(){save("todos/list",{items:state.todos});if(!db)lsSet("todos/list",{items:state.todos})}

async function boot(){
  // Rendu immédiat avec ce que ce navigateur connaît déjà
  state.days=lsGet("days",{});state.template=lsGet("settings/template",state.template);state.rev=lsGet("revision/state",state.rev);state.todos=lsGet("todos/list",{items:[]}).items||[];state.train=lsGet("training/log",{sessions:[]}).sessions||[];state.lastEdit=lsGet("meta",{}).lastEdit||0;
  render();
  db=window.claude?.use?await window.claude.use("db"):null;
  if(!db){setStatus("Données gardées sur cet appareil");return}
  let loaded=false;const timer=setTimeout(()=>{if(!loaded)setStatus("Synchro lente…")},10000);
  db.collection("days").onSnapshot(s=>{
    const d={};s.docs.forEach(x=>{d[x.id]=(x.data().blocks||[])});state.days=d;
    if(!s.metadata.fromCache){loaded=true;clearTimeout(timer);state.online=true;setStatus("Synchronisé iPhone / iPad")}
    render();
  },()=>setStatus("Synchro indisponible"));
  db.doc("settings/template").onSnapshot(s=>{if(s.exists){state.template=s.data();render()}},()=>{});
  db.doc("training/log").onSnapshot(s=>{if(s.exists){state.train=s.data().sessions||[];render()}},()=>{});
  db.doc("todos/list").onSnapshot(s=>{if(s.exists){state.todos=s.data().items||[];render()}},()=>{});
  db.doc("revision/state").onSnapshot(s=>{if(s.exists){state.rev=s.data();render()}},()=>{});
}
let statusText="";function setStatus(t){statusText=t;const el=$("#status");if(el)el.textContent=t}
if(!window.claude)window.addEventListener("load",()=>{});
// lsSet miroir pour le mode hors base
function mirror(){if(!db){lsSet("days",state.days)}}

/* ---------- Routage ---------- */
function tab(){const h=location.hash.slice(1);return["jour","taches","entrainements","semaine","partiels"].includes(h)?h:"jour"}
window.addEventListener("hashchange",render);

function render(){
  const t=tab();
  if(t==="partiels"&&typeof revEditing!=="undefined"&&revEditing)return;
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t));
  $("#fab").hidden=t!=="jour"&&t!=="semaine";
  if(t==="jour")renderDay();else if(t==="taches")renderTodos();else if(t==="entrainements")renderTrain();else if(t==="semaine")renderWeek();else renderRev();
}

/* ---------- Jour ---------- */
function totals(blocks){const o={};COLS.forEach(c=>o[c.k]=0);(blocks||[]).forEach(b=>{o[b.col]=(o[b.col]||0)+dur(b)});return o}
function renderDay(){
  const d=parse(state.sel),todayK=key(new Date()),blocks=state.days[state.sel]||[];
  const mon=mondayOf(d);
  const strip=[...Array(7)].map((_,i)=>{const x=addDays(mon,i),k=key(x),bl=state.days[k]||[];
    const cats=[...new Set(bl.map(b=>b.col))];
    return `<button class="wd ${k===state.sel?"sel":""} ${k===todayK?"today":""}" data-go="${k}"><small>${JOURS[x.getDay()]}</small><b>${x.getDate()}</b><span class="dots">${cats.map(c=>`<i style="background:${CV(c)}"></i>`).join("")}</span></button>`}).join("");
  const tot=totals(blocks);
  const chips=COLS.filter(c=>tot[c.k]).map(c=>`<span class="chip"><i style="background:${CV(c.k)}"></i>${c.n} <span class="mono">${fmtH(tot[c.k])}</span></span>`).join("");
  const tpl=(state.template.days||{})[d.getDay()]||[];
  const empty=!blocks.length?`<div class="empty"><span>Rien de prévu ce ${JOURS_L[d.getDay()].toLowerCase()}. Tape une case horaire pour ajouter un créneau.</span>${tpl.length?`<button class="btn primary" data-act="applytpl">Remplir avec la semaine type</button>`:""}</div>`:"";
  const hours=[...Array(24)].map((_,h)=>`<div class="tlabel mono">${pad(h)}:00</div>`).join("");
  const laid=COLS.map(c=>layoutLane(blocks.filter(b=>b.col===c.k)));
  const widths=laid.map(l=>Math.max(1,...l.map(x=>x.n)));
  const gridCols=`52px ${widths.map(n=>`minmax(${n>1?n*112:124}px,${n}fr)`).join(" ")}`,gridMin=52+widths.reduce((s,n)=>s+(n>1?n*112:124),0);
  const lanes=COLS.map((c,ci)=>`<div class="lane" data-col="${c.k}">${laid[ci].map(({b,col:sc,n})=>{
      const top=toMin(b.start)/60*52, h=Math.max(22,dur(b)/60*52-3);
      return `<button class="block ${b.done?"done":""} ${n>1?"split":""}" data-edit="${b.id}" title="${esc(b.title)} · ${b.start}–${b.end}" style="top:${top}px;height:${h}px;left:calc(4px + (100% - 8px) * ${sc} / ${n});width:calc((100% - 8px) / ${n} - ${n>1?3:0}px);background:${TV(c.k)};border-left-color:${CV(c.k)};color:var(--ink)"><b>${esc(b.title)}</b><span>${b.start}–${b.end}</span></button>`}).join("")}</div>`).join("");
  const isToday=state.sel===todayK, now=new Date(), nowTop=(now.getHours()*60+now.getMinutes())/60*52;
  $("#view").innerHTML=`
  <div class="dayhead">
    <div><div class="eyebrow">${isToday?"Aujourd'hui":JOURS_L[d.getDay()]}</div><h1>${JOURS_L[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}</h1><div class="status" id="status">${esc(statusText)}</div></div>
    <div class="row">
      <button class="icon-btn" data-shift="-1" aria-label="Jour précédent">‹</button>
      ${isToday?"":`<button class="btn" data-go="${todayK}">Aujourd'hui</button>`}
      <button class="icon-btn" data-shift="1" aria-label="Jour suivant">›</button>
    </div>
  </div>
  <div class="weekstrip">${strip}</div>
  ${chips?`<div class="chips">${chips}</div>`:""}
  ${dayTodosHTML(state.sel)}
  <div class="gridbox">${empty}
    <div class="gridscroll"><div class="grid" id="grid" style="grid-template-columns:${gridCols};min-width:${gridMin}px">
      <div class="colhead"></div>${COLS.map(c=>`<div class="colhead"><i style="background:${CV(c.k)}"></i>${c.n}</div>`).join("")}
      <div class="timecol">${hours}</div>${lanes}
      ${isToday?`<div class="nowline" style="top:${nowTop+39}px"></div>`:""}
    </div></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn" data-act="datasheet">⇅ Mes données</button>
    ${blocks.length?`<button class="btn ghost" data-act="savetpl">Faire de ce jour le modèle du ${JOURS_L[d.getDay()].toLowerCase()}</button>`:""}
  </div>`;
  // place la ligne "maintenant" sous l'en-tête de colonnes
  const g=$("#grid"),hd=g?.querySelector(".colhead");const nl=g?.querySelector(".nowline");if(nl&&hd)nl.style.top=(nowTop+hd.offsetHeight)+"px";
  if(isToday&&!render._scrolled){render._scrolled=1;const sc=Math.max(0,nowTop-160);window.scrollTo(0,0);const box=document.querySelector(".gridbox");if(box)window.scrollTo({top:box.offsetTop+sc-60})}
}

// Répartit côte à côte les créneaux qui se chevauchent dans une même colonne
function layoutLane(list){
  const ev=list.map(b=>{const s0=toMin(b.start);return{b,s:s0,e:Math.max(s0+25,b.end==="00:00"?1440:toMin(b.end))}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],cEnd=-1;
  const flush=()=>{const tracks=[];cl.forEach(x=>{let i=tracks.findIndex(end=>end<=x.s);if(i<0){i=tracks.length;tracks.push(0)}tracks[i]=x.e;x.col=i});cl.forEach(x=>x.n=tracks.length);out.push(...cl);cl=[]};
  ev.forEach(x=>{if(cl.length&&x.s>=cEnd){flush();cEnd=-1}cl.push(x);cEnd=Math.max(cEnd,x.e)});
  if(cl.length)flush();return out}

/* ---------- Semaine ---------- */
function renderWeek(){
  const d=parse(state.sel),mon=mondayOf(d),todayK=key(new Date());
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const all=days.flatMap(x=>state.days[key(x)]||[]);
  const tot=totals(all);const max=Math.max(60,...Object.values(tot));
  const cols=days.map(x=>{const k=key(x),bl=(state.days[k]||[]).filter(b=>wFilter==="all"||b.col===wFilter);
    const bars=bl.map(b=>`<i style="top:${toMin(b.start)/1440*100}%;height:${Math.max(1.2,dur(b)/1440*100)}%;background:${CV(b.col)}"></i>`).join("");
    return `<button class="wcol ${k===todayK?"today":""}" data-go="${k}" data-to="jour"><small class="eyebrow">${JOURS[x.getDay()]}</small><b style="font-family:var(--f-display);font-size:18px">${x.getDate()}</b><div class="wbar">${bars}</div><small class="muted mono">${fmtH(bl.reduce((s,b)=>s+dur(b),0))}</small></button>`}).join("");
  const tpl=state.template.days||{};
  const order=[1,2,3,4,5,6,0];
  $("#view").innerHTML=`
  <div class="dayhead">
    <div><div class="eyebrow">Semaine du ${mon.getDate()} ${MOIS[mon.getMonth()]}</div><h1>Vue semaine</h1></div>
    <div class="row"><button class="icon-btn" data-shift="-7" aria-label="Semaine précédente">‹</button><button class="icon-btn" data-shift="7" aria-label="Semaine suivante">›</button></div>
  </div>
  <div class="totals">${COLS.map(c=>`<div class="tot"><span class="eyebrow">${c.n}</span><b class="mono">${fmtH(tot[c.k])}</b><div class="meter"><i style="width:${tot[c.k]/max*100}%;background:${CV(c.k)}"></i></div></div>`).join("")}</div>
  <div class="filters"><button class="fbtn ${wFilter==="all"?"on":""}" data-wf="all">Tout</button>${COLS.map(c=>`<button class="fbtn ${wFilter===c.k?"on":""}" data-wf="${c.k}"><span style="color:${CV(c.k)}">●</span> ${c.n}</button>`).join("")}</div>
  <div class="weekgrid">${cols}</div>
  <p class="muted" style="font-size:13px">Chaque colonne montre la journée de 00h (haut) à 24h (bas). Tape un jour pour l'ouvrir.</p>
  ${progHTML(wFilter==="all"?COLS.map(c=>c.k):[wFilter],wFilter==="all"?"Prog de la semaine":"Prog de la semaine · "+COLS.find(c=>c.k===wFilter).n,{from:key(mon),to:key(addDays(mon,6)),empty:"Rien dans cette catégorie cette semaine."})}
  <div class="section">
    <h2>Semaine type</h2>
    <p class="muted" style="margin:0;max-width:62ch">Le modèle qui remplit un jour vide en un tap. Pour le modifier, ajuste un jour réel puis « Faire de ce jour le modèle ».</p>
    <div class="tpl">${order.map(i=>{const bl=(tpl[i]||[]).slice().sort((a,b)=>toMin(a.start)-toMin(b.start));
      return `<div class="tplday"><b>${JOURS[i]}</b><ul>${bl.length?bl.map(b=>`<li><span class="mono muted">${b.start}–${b.end}</span> <span style="color:${CV(b.col)}">●</span> ${esc(b.title)}</li>`).join(""):`<li class="muted">Rien</li>`}</ul></div>`}).join("")}</div>
    <div class="row"><button class="btn primary" data-act="applyweek">Appliquer aux jours vides de cette semaine</button></div>
  </div>`;
}

/* ---------- Prog filtrée (réutilisée par les onglets) ---------- */
function progHTML(cols,title,opt={}){
  const today=key(new Date()),start=opt.from||today,end=opt.to||key(addDays(new Date(),21));
  const ks=Object.keys(state.days).filter(k=>k>=start&&k<=end).sort();
  const rows=ks.map(k=>{const bl=(state.days[k]||[]).filter(b=>cols.includes(b.col)).sort((a,b)=>toMin(a.start)-toMin(b.start));if(!bl.length)return"";const dd=parse(k);
    return `<div class="progday ${k<today?"past":""}"><div class="d">${JOURS[dd.getDay()]}<b>${dd.getDate()}</b>${MOIS[dd.getMonth()].slice(0,4)}.</div><div class="progitems">${bl.map(b=>{
      const logged=opt.log&&state.train.some(x=>x.from===k+"_"+b.id),canLog=opt.log&&k<=today&&!/repos/i.test(b.title);
      return `<div class="progitem"><button class="pi" data-editat="${k}|${b.id}" style="border-left-color:${CV(b.col)}"><span class="mono muted">${b.start}–${b.end}</span> <b>${esc(b.title)}</b>${blockEps(b).filter(epName).map(id=>` <span style="color:${epColor(id)};font-weight:600">· ${esc(epName(id))}</span>`).join("")}${b.done?' <span class="muted">✓</span>':""}</button>${canLog?(logged?`<span class="pill ok">Saisie</span>`:`<button class="btn" data-logplan="${k}|${b.id}">Saisir</button>`):""}</div>`}).join("")}</div></div>`}).join("");
  return `<section class="ep prog"><div class="row" style="justify-content:space-between"><h3>${title}</h3><button class="btn" data-addprog="${cols[0]}">+ Créneau</button></div>${rows||`<p class="muted" style="margin:0;font-size:13.5px">${opt.empty||"Rien de prévu sur les 3 prochaines semaines."}</p>`}</section>`}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.editat){const[k,id]=t.dataset.editat.split("|"),b=(state.days[k]||[]).find(x=>x.id===id);if(b)openSheet({...b,_k:k})}
  if(t.dataset.addprog){openSheet({col:t.dataset.addprog,_k:key(new Date()),start:"18:00",end:"19:00"})}
});

/* ---------- Tâches ---------- */
const TCATS=[{k:"grun",n:"GRÜN"},...COLS,{k:"perso",n:"Perso / admin"}];
const catName=k=>(TCATS.find(c=>c.k===k)||{n:"Perso / admin"}).n;
const catColor=k=>k==="perso"?"var(--muted)":CV(k);
let tFilter="toutes",tCat="all";
function todoLi(x,showDate){
  const today=key(new Date()),late=x.due&&!x.done&&x.due<today;
  const when=x.due?`<span class="pill ${late?"warn":""}">${late?"En retard · ":""}${parse(x.due).getDate()} ${MOIS[parse(x.due).getMonth()].slice(0,4)}.</span>`:"";
  return `<li class="${x.done?"done":""}">
    <input type="checkbox" id="td_${x.id}" data-todo="${x.id}" ${x.done?"checked":""}>
    <button type="button" class="tdtext" data-edittodo="${x.id}"><span style="color:${catColor(x.col)}">●</span> ${x.prio?"<b>!</b> ":""}${esc(x.t)}</button>
    ${showDate?when:""}
    <button class="x" data-pin="${x.id}" aria-label="${x.day===state.sel?"Retirer de ce jour":"Mettre sur ce jour"}" title="${x.day===state.sel?"Retirer de ce jour":"Faire ce jour"}" style="color:${x.day===state.sel?"var(--accent)":"var(--muted)"}">◎</button>
    <button class="x" data-deltodo="${x.id}" aria-label="Supprimer">×</button>
  </li>`;
}
function todosForDay(k){
  const today=key(new Date());
  return state.todos.filter(x=>x.day===k||x.due===k||(k===today&&!x.done&&x.due&&x.due<today))
    .sort((a,b)=>(a.done-b.done)||(b.prio-a.prio));
}
function dayTodosHTML(k){
  const l=todosForDay(k),dn=l.filter(x=>x.done).length;
  return `<section class="todocard">
    <div class="row" style="justify-content:space-between"><h3>À faire ce jour</h3><span class="muted mono" style="font-size:13px">${l.length?`${dn}/${l.length}`:""}</span></div>
    ${l.length?`<ul class="items">${l.map(x=>todoLi(x,false)).join("")}</ul>`:`<p class="muted" style="margin:0;font-size:13.5px">Ajoute une tâche ici, ou épingle-la depuis l'onglet Tâches avec ◎.</p>`}
    <form class="addrow" data-quicktodo="${k}"><input class="field" id="qt_${k}" placeholder="Nouvelle tâche pour ce jour"><button class="btn">Ajouter</button></form>
  </section>`;
}
function renderTodos(){
  const today=key(new Date()),mon=key(mondayOf(new Date())),sun=key(addDays(mondayOf(new Date()),6));
  let l=state.todos.slice();
  if(tCat!=="all")l=l.filter(x=>x.col===tCat);
  const f={
    toutes:x=>!x.done,
    jour:x=>!x.done&&(x.day===today||(x.due&&x.due<=today)),
    semaine:x=>!x.done&&((x.due&&x.due<=sun)||(x.day&&x.day>=mon&&x.day<=sun)),
    faites:x=>x.done
  }[tFilter];
  l=l.filter(f).sort((a,b)=>(b.prio-a.prio)||(a.due||"9999").localeCompare(b.due||"9999"));
  const open=state.todos.filter(x=>!x.done).length,late=state.todos.filter(x=>!x.done&&x.due&&x.due<today).length;
  const groups=TCATS.map(c=>({c,items:l.filter(x=>(x.col||"perso")===c.k)})).filter(g=>g.items.length);
  $("#view").innerHTML=`
  <div class="dayhead"><div><div class="eyebrow">${open} ouverte${open>1?"s":""}${late?` · ${late} en retard`:""}</div><h1>To-do</h1></div><button class="btn" data-act="datasheet">⇅ Mes données</button></div>
  <form class="todoform" id="todoform">
    <input class="field" id="nt_text" placeholder="Que faut-il faire ?" required>
    <div class="row">
      <select class="field" id="nt_col" style="width:auto">${TCATS.map(c=>`<option value="${c.k}">${c.n}</option>`).join("")}</select>
      <input class="field" type="date" id="nt_due" style="width:auto" aria-label="Échéance">

const nrm=x=>x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const DAY_RE=/^(?:(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+)?(\d{1,2})(?:er)?\s+(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)(\s+\d{4})?\s*(.*)$/i;
function frDate(m){const mo=MOIS.findIndex(x=>nrm(x)===nrm(m[2]));const now=new Date();let y=m[3]?+m[3]:now.getFullYear();let d=new Date(y,mo,+m[1]);if(!m[3]&&d>addDays(now,31))d=new Date(y-1,mo,+m[1]);return key(d)}
function secCode(sec){if(!sec)return"";let m=sec.match(/^([A-G]\d{1,2})\b/);if(m)return m[1];m=sec.match(/^([A-G])\)/);if(m)return m[1];
  const t=nrm(sec);if(/mobilit|echauf|prevention/.test(t))return"A";if(/nerveux|plio|explo/.test(t))return"B";if(/puissance/.test(t))return"C";if(/force/.test(t))return"D";if(/hypertroph|accessoire|prophyl/.test(t))return"E";if(/core|gainage|abdo/.test(t))return"F";if(/cardio/.test(t))return"G";return""}
function parseSalle(txt){
  const L=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),out=[];let cur=null,sec="";
  const isDash=l=>/^[-–•·]/.test(l);
  const isSet=l=>/^[-–•·]\s*(pdc|[\d.,]+)\s*(kg)?\s*\(/i.test(l);
  const REST=/\(([^()]*\d[^()]*[’'′][^()]*)\)\s*$/;
  for(let i=0;i<L.length;i++){const l=L[i],nx=L[i+1]||"";
    const dm=isDash(l)?null:l.match(DAY_RE);
    if(dm){cur={date:frDate(dm),lieu:(dm[4]||"").trim(),nom:"",ex:[]};out.push(cur);sec="";continue}
    if(!cur){cur={date:null,lieu:"",nom:"",ex:[]};out.push(cur)}
    if(isSet(l)&&cur.ex.length){const m=l.match(/^[-–•·]\s*(pdc|[\d.,]+)\s*(?:kg)?\s*\(([^)]*)\)/i);cur.ex[cur.ex.length-1].sets.push({k:m[1],r:m[2].trim()});continue}
    if(isDash(l)){const body=l.replace(/^[-–•·]\s*/,""),sm=body.match(/^(.*?)\s+(\d+\s*[x×]\s*\S.*)$/i);
      cur.ex.push(newEx({sec,bloc:secCode(sec),name:(sm?sm[1]:body).trim(),scheme:sm?sm[2].trim():""}));continue}
    const rm=l.match(REST);
    if(rm){cur.ex.push(newEx({sec,bloc:secCode(sec),name:l.replace(REST,"").trim(),rest:rm[1].trim()}));continue}
    if(/^[A-G]\)/.test(l)||/^[A-G]\d{1,2}\b/.test(l)){sec=l.replace(/\s+/g," ");continue}
    if(isSet(nx)){cur.ex.push(newEx({sec,bloc:secCode(sec),name:l}));continue}
    if(isDash(nx)){sec=l;continue}
    if(!cur.lieu&&!cur.ex.length){cur.lieu=l;continue}
    if(!cur.nom&&!cur.ex.length){cur.nom=l;continue}
    sec=l;
  }
  return out.filter(x=>x.ex.length)}

/* Glisser-déposer des exercices (maintenir la poignée ⠿) */
(function(){let drag=null;
  document.addEventListener("pointerdown",e=>{const g=e.target.closest("[data-grip]");if(!g)return;e.preventDefault();
    const card=g.closest(".exo"),cards=[...document.querySelectorAll("#trainform .exo")];
    drag={from:+g.dataset.grip,card,cards,startY:e.clientY,to:+g.dataset.grip,rects:cards.map(c=>c.getBoundingClientRect())};
    card.classList.add("dragging");g.setPointerCapture?.(e.pointerId);if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){}});
  document.addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();const dy=e.clientY-drag.startY;drag.card.style.transform=`translateY(${dy}px)`;
    const mid=drag.rects[drag.from].top+drag.rects[drag.from].height/2+dy;let to=drag.from;
    drag.rects.forEach((r,i)=>{if(i<drag.from&&mid<r.top+r.height/2)to=Math.min(to,i);if(i>drag.from&&mid>r.top+r.height/2)to=Math.max(to,i)});
    drag.to=to;const h=drag.rects[drag.from].height+8;
    drag.cards.forEach((c,i)=>{if(c===drag.card)return;let s=0;if(drag.from<to&&i>drag.from&&i<=to)s=-h;if(drag.from>to&&i<drag.from&&i>=to)s=h;c.style.transform=s?`translateY(${s}px)`:""})},{passive:false});
  const end=()=>{if(!drag)return;const{from,to}=drag;drag.cards.forEach(c=>{c.style.transform="";c.classList.remove("dragging")});drag=null;
    if(from!==to){keepTrain();const a=tDraft.salle.ex,[m]=a.splice(from,1);a.splice(to,0,m);render()}};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
})();

  if(mode==="replace"){state.days=d.days||{};state.template=d.template||{days:{}};state.rev=d.rev||state.rev;state.todos=d.todos||[];state.train=d.train||[]}
  else{
    const days={...state.days};Object.entries(d.days||{}).forEach(([k,bl])=>{days[k]=byId(days[k],bl)});state.days=days;
    state.todos=byId(state.todos,d.todos);state.train=byId(state.train,d.train);
    state.rev={...state.rev,endDate:state.rev.endDate||d.rev?.endDate,epreuves:byId(state.rev.epreuves,d.rev?.epreuves).map(ep=>{const o=(d.rev?.epreuves||[]).find(x=>x.id===ep.id);return o?{...ep,date:ep.date||o.date,items:byId(ep.items,o.items)}:ep})};
    const td={...(d.template?.days||{}),...(state.template.days||{})};state.template={...state.template,days:td};
  }
  importing=true;try{persistAll()}finally{importing=false}
  state.lastEdit=d.lastEdit||Date.parse(d.exportedAt)||Date.now();lsSet("meta",{lastEdit:state.lastEdit});render();
}

function peekImport(txt){const i=txt.indexOf("{");if(i<0)return null;try{const d=JSON.parse(txt.slice(i));return d.app==="planning-eliot"?d:null}catch(e){return null}}

      ${warn?`<div class="dswarn">Cet appareil a été modifié <b>${fmtStamp(warn.local)}</b>, après la copie collée (<b>${fmtStamp(warn.incoming)}</b>). Ces modifs récentes seront perdues.<div class="row" style="margin-top:8px"><button type="button" class="btn danger" data-ds="force">Mettre à jour quand même</button><button type="button" class="btn" data-ds="cancel">Annuler</button></div></div>`
        :`<div class="row"><button type="button" class="btn primary" data-ds="replace">Mettre à jour cet appareil</button><button type="button" class="btn ghost" data-ds="merge">Ajouter seulement ce qui manque</button></div>`}
      ${msg?`<p style="margin:0;font-size:13.5px;font-weight:600">${esc(msg)}</p>`:""}</section>

  if(keepIn)$("#ds_in").value=keepIn;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};

  const act=a=>{const txt=$("#ds_in")?.value||"";

      const incoming=d.lastEdit||Date.parse(d.exportedAt)||0;
      if(state.lastEdit&&incoming&&state.lastEdit>incoming+1000){warn={local:state.lastEdit,incoming};msg="";draw(txt);return}
      run(txt,"replace")}};

/* ---------- Calendrier des partiels ---------- */
const EPC=["#4F5BD5","#1E9E6A","#E08A00","#B03FC8","#E0456B","#0E8FA6","#8DAA00","#C2410C","#7C8796","#2563EB"];
function sortedEps(){return(state.rev.epreuves||[]).slice().sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"))}
function epColor(id){const i=sortedEps().findIndex(e=>e.id===id);return i<0?"var(--c-rev)":EPC[i%EPC.length]}
function epName(id){return(state.rev.epreuves||[]).find(e=>e.id===id)?.name||""}
function blockEps(b){return b.eps||(b.ep?[b.ep]:[])}
// une séance partagée entre plusieurs épreuves répartit son temps à parts égales
function revHoursByEp(){const o={};Object.values(state.days).forEach(bl=>(bl||[]).forEach(b=>{const es=blockEps(b);if(b.col!=="rev"||!es.length)return;const part=dur(b)/es.length;es.forEach(id=>{o[id]=o[id]||{plan:0,done:0};o[id].plan+=part;if(b.done)o[id].done+=part})}));Object.values(o).forEach(v=>{v.plan=Math.round(v.plan);v.done=Math.round(v.done)});return o}
function revCalendarHTML(){
  const eps=sortedEps(),today=key(new Date());
  const ds=eps.map(e=>e.date).filter(Boolean).concat(state.rev.endDate?[state.rev.endDate]:[]).sort();
  const start=mondayOf(new Date());
  let end=addDays(mondayOf(ds.length?parse(ds[ds.length-1]):addDays(new Date(),28)),6);
  if(end<addDays(start,27))end=addDays(start,27);
  if(end>addDays(start,7*14-1))end=addDays(start,7*14-1);
  let cells="";
  for(let x=new Date(start);x<=end;x=addDays(x,1)){
    const k=key(x),ex=eps.filter(e=>e.date===k),rb=(state.days[k]||[]).filter(b=>b.col==="rev"),mins=rb.reduce((s,b)=>s+dur(b),0);
    const first=k===key(start)||x.getDate()===1;
    cells+=`<button class="cday ${k<today?"past":""} ${k===today?"today":""} ${ex.length?"exam":""}" data-go="${k}" data-to="jour" ${ex.length?`style="--ec:${epColor(ex[0].id)}"`:""} aria-label="${x.getDate()} ${MOIS[x.getMonth()]}${ex.length?", "+ex.map(e=>e.name).join(", "):""}">
      <span class="cnum">${first?`<span class="cmon">${MOIS[x.getMonth()].slice(0,4)}.</span> `:""}${x.getDate()}${state.rev.endDate===k?' <span class="cend">Fin</span>':""}</span>
      ${ex.map(e=>`<span class="cex" style="color:${epColor(e.id)}">${esc(e.name)}</span>`).join("")}
      ${rb.length?`<span class="cdots">${rb.map(b=>{const es=blockEps(b).filter(epName);return es.length?es.map(id=>`<i style="background:${epColor(id)}" title="${esc(b.title)} · ${esc(epName(id))}"></i>`).join(""):`<i style="background:var(--c-rev)" title="${esc(b.title)}"></i>`}).join("")}</span><span class="chrs">${fmtH(mins)}</span>`:""}
    </button>`;
  }
  const legend=eps.length?`<div class="clegend">${eps.map(e=>`<span><i style="background:${epColor(e.id)}"></i>${esc(e.name)}${e.date?` <span class="mono muted">${parse(e.date).getDate()}/${pad(parse(e.date).getMonth()+1)}</span>`:""}</span>`).join("")}</div>`:"";
  return `<div class="calwrap"><div class="cal">${["lun","mar","mer","jeu","ven","sam","dim"].map(j=>`<span class="wdh">${j}</span>`).join("")}${cells}</div>${legend}
  <p class="muted" style="margin:0;font-size:12.5px">Les carrés colorés sont tes séances de révision. Rattache chaque créneau Révisions à une épreuve (champ « Pour l'épreuve ») pour qu'il prenne sa couleur.</p></div>`}
